<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Subtle linear gradients for PCB traces & typography -->
    <linearGradient id="trace-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="trace-dim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="text-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="text-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- PCB Grid Pattern -->
    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#334155" fill-opacity="0.4"/>
    </pattern>

    <!-- Component Pad Definition -->
    <g id="via">
      <circle cx="0" cy="0" r="3.2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.2" fill="#080a0f"/>
    </g>
    <g id="via-dim">
      <circle cx="0" cy="0" r="2.8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#080a0f"/>
    </g>
    <g id="smd-pad">
      <rect x="-3" y="-5" width="6" height="10" rx="1" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Deep stealth matte substrate -->
  <rect width="1000" height="340" fill="#06080d" rx="10"/>
  <rect width="1000" height="340" fill="url(#pcb-grid)" rx="10"/>

  <!-- ==================== BACKGROUND PCB TRACES ==================== -->
  <g id="background-traces" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dim ambient routing traces -->
    <path d="M 0 60 L 120 60 L 170 110 L 280 110" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 0 80 L 110 80 L 160 130 L 260 130" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 0 100 L 100 100 L 140 140 L 140 220 L 180 260 L 320 260" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    
    <path d="M 1000 60 L 880 60 L 830 110 L 720 110" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 1000 80 L 890 80 L 840 130 L 740 130" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 1000 100 L 900 100 L 860 140 L 860 220 L 820 260 L 680 260" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>

    <!-- High-speed differential pair (Left) -->
    <path d="M 30 340 L 30 280 L 90 220 L 90 140 L 140 90 L 220 90" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M 42 340 L 42 285 L 102 225 L 102 145 L 148 99 L 220 99" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- High-speed bus traces (Right) -->
    <path d="M 970 340 L 970 280 L 910 220 L 910 140 L 860 90 L 780 90" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M 958 340 L 958 285 L 898 225 L 898 145 L 852 99 L 780 99" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- Horizontal interconnects & 45-degree breakouts -->
    <path d="M 220 90 L 250 60 L 360 60" fill="none" stroke="url(#trace-cyan)" stroke-width="1.2"/>
    <path d="M 780 90 L 750 60 L 640 60" fill="none" stroke="url(#trace-cyan)" stroke-width="1.2"/>

    <path d="M 280 110 L 320 70 L 400 70" fill="none" stroke="url(#trace-dim)" stroke-width="1"/>
    <path d="M 720 110 L 680 70 L 600 70" fill="none" stroke="url(#trace-dim)" stroke-width="1"/>

    <path d="M 180 260 L 220 300 L 380 300" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 820 260 L 780 300 L 620 300" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>

    <!-- Bottom ground trace runs -->
    <path d="M 380 300 L 410 330 L 590 330 L 620 300" fill="none" stroke="url(#trace-cyan)" stroke-width="1.2" stroke-dasharray="6 3"/>
  </g>

  <!-- ==================== VIA ARRAYS & SOLDER PADS ==================== -->
  <use href="#via" x="220" y="90"/>
  <use href="#via" x="220" y="99"/>
  <use href="#via" x="360" y="60"/>
  <use href="#via" x="400" y="70"/>
  <use href="#via" x="280" y="110"/>
  <use href="#via" x="260" y="130"/>
  <use href="#via" x="320" y="260"/>

  <use href="#via" x="780" y="90"/>
  <use href="#via" x="780" y="99"/>
  <use href="#via" x="640" y="60"/>
  <use href="#via" x="600" y="70"/>
  <use href="#via" x="720" y="110"/>
  <use href="#via" x="740" y="130"/>
  <use href="#via" x="680" y="260"/>

  <!-- Left SMT Pin Header Row -->
  <use href="#smd-pad" x="70" y="30"/>
  <use href="#smd-pad" x="85" y="30"/>
  <use href="#smd-pad" x="100" y="30"/>
  <use href="#smd-pad" x="115" y="30"/>
  <use href="#smd-pad" x="130" y="30"/>
  <use href="#smd-pad" x="145" y="30"/>

  <!-- Right SMT Pin Header Row -->
  <use href="#smd-pad" x="855" y="30"/>
  <use href="#smd-pad" x="870" y="30"/>
  <use href="#smd-pad" x="885" y="30"/>
  <use href="#smd-pad" x="900" y="30"/>
  <use href="#smd-pad" x="915" y="30"/>
  <use href="#smd-pad" x="930" y="30"/>

  <!-- BGA Matrix Points (Subtle silicon substrate dots) -->
  <g fill="#334155" opacity="0.6">
    <circle cx="50" cy="180" r="1.5"/><circle cx="65" cy="180" r="1.5"/><circle cx="50" cy="195" r="1.5"/><circle cx="65" cy="195" r="1.5"/>
    <circle cx="935" cy="180" r="1.5"/><circle cx="950" cy="180" r="1.5"/><circle cx="935" cy="195" r="1.5"/><circle cx="950" cy="195" r="1.5"/>
  </g>

  <!-- ==================== SILICON / SYSTEM FRAME ==================== -->
  <!-- Outer border caliper marks -->
  <path d="M 25 35 L 25 25 L 35 25" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 975 35 L 975 25 L 965 25" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 25 305 L 25 315 L 35 315" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 975 305 L 975 315 L 965 315" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Inner Chip Die Boundary Box -->
  <rect x="230" y="80" width="540" height="175" rx="4" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="235" y="85" width="530" height="165" rx="2" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Technical Monospace Headers -->
  <text x="245" y="103" fill="#38bdf8" font-family="monospace" font-size="9" letter-spacing="2">SYS_ARCH // SH-CORE-V2</text>
  <text x="755" y="103" fill="#64748b" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="end">FMAX &gt;= 350MHz [DETERMINISTIC]</text>

  <!-- Horizontal divider inside die box -->
  <line x1="245" y1="112" x2="755" y2="112" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== CENTRAL HERO TYPOGRAPHY ==================== -->
  <!-- Name -->
  <text x="500" y="156" fill="url(#text-silver)" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="300" letter-spacing="14" text-anchor="middle">S O U V I K   H A L D E R</text>

  <!-- Tagline -->
  <text x="500" y="188" fill="url(#text-cyan)" font-family="monospace" font-size="12" font-weight="600" letter-spacing="4" text-anchor="middle">PRODUCT DESIGNER // HARDWARE SYSTEMS ARCHITECT</text>

  <!-- Subtitle metadata -->
  <text x="500" y="210" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" letter-spacing="2" text-anchor="middle">FIRST-PRINCIPLES SILICON · DETERMINISTIC COMPUTE · PHYSICAL SYSTEMS</text>

  <!-- Chip Specs Bar inside box -->
  <g transform="translate(260, 224)">
    <rect x="0" y="0" width="145" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="72" y="12" fill="#cbd5e1" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle">NEURAL DATAPATHS</text>

    <rect x="165" y="0" width="150" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="240" y="12" fill="#cbd5e1" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle">INTERLEAVED SRAM</text>

    <rect x="335" y="0" width="145" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="407" y="12" fill="#cbd5e1" font-family="monospace" font-size="8" letter-spacing="1" text-anchor="middle">CYBER-PHYSICAL</text>
  </g>

  <!-- ==================== LOWER TECHNICAL SILKSCREEN ==================== -->
  <text x="35" y="325" fill="#475569" font-family="monospace" font-size="8.5" letter-spacing="1.5">NETLIST: VERILOG-2001 // SYNTHESIZABLE</text>
  <text x="500" y="325" fill="#334155" font-family="monospace" font-size="8" letter-spacing="2" text-anchor="middle">IMPEDANCE MATCHED · ZERO STALL CYCLES · OVERFLOW BOUNDED</text>
  <text x="965" y="325" fill="#475569" font-family="monospace" font-size="8.5" letter-spacing="1.5" text-anchor="end">LOC: 22.45N 88.36E // KGP</text>
</svg>
