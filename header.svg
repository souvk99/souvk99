<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1" fill="#475569" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="#080a0f" rx="12"/>
  <rect width="1000" height="320" fill="url(#grid)" rx="12"/>

  <!-- Architectural Framing Accents -->
  <!-- Top-left coordinate -->
  <text x="35" y="40" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="2">ARCH // 22.45°N 88.36°E</text>
  <!-- Top-right status -->
  <rect x="805" y="28" width="160" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="820" cy="39" r="3.5" fill="#10b981"/>
  <text x="832" y="43" fill="#cbd5e1" font-family="monospace" font-size="9" letter-spacing="1">DETERMINISTIC SYS</text>

  <!-- Fine framing rules -->
  <line x1="35" y1="58" x2="965" y2="58" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="262" x2="965" y2="262" stroke="#1e293b" stroke-width="1"/>

  <!-- Center Monogram Accent -->
  <text x="500" y="112" fill="url(#gold-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="6" text-anchor="middle">ATELIER FOR SILICON &amp; PHYSICAL COMPUTING</text>

  <!-- Main Name Title -->
  <text x="500" y="160" fill="url(#silver-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="300" letter-spacing="12" text-anchor="middle">S O U V I K   H A L D E R</text>

  <!-- Subtitle -->
  <text x="500" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" letter-spacing="4" text-anchor="middle">PRODUCT DESIGNER  ·  HARDWARE SYSTEMS ARCHITECT</text>

  <!-- Bottom Spec Chips -->
  <g transform="translate(130, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="110" y="17" fill="#cbd5e1" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="middle">VLSI &amp; NEURAL DATAPATHS</text>

    <!-- Pill 2 -->
    <rect x="260" y="0" width="220" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="370" y="17" fill="#cbd5e1" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="middle">HIGH-BANDWIDTH SRAM ARCH</text>

    <!-- Pill 3 -->
    <rect x="520" y="0" width="220" height="26" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="630" y="17" fill="#cbd5e1" font-family="monospace" font-size="10" letter-spacing="1" text-anchor="middle">CONNECTED PHYSICAL SYSTEMS</text>
  </g>

  <!-- Corner Register Marks (Architectural Calipers) -->
  <path d="M 35 75 L 35 65 L 45 65" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 965 75 L 965 65 L 955 65" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 35 245 L 35 255 L 45 255" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <path d="M 965 245 L 965 255 L 955 255" fill="none" stroke="#64748b" stroke-width="1.2"/>

  <!-- Footer metadata -->
  <text x="35" y="285" fill="#475569" font-family="monospace" font-size="9" letter-spacing="1.5">FORM FOLLOWS ARCHITECTURE</text>
  <text x="965" y="285" fill="#475569" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="end">FIRST-PRINCIPLES HARDWARE</text>
</svg>
