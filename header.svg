<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Subtle linear gradients for PCB traces & typography -->
    <linearGradient id="trace-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="trace-dim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="text-silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="text-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- PCB Grid Pattern -->
    <pattern id="pcb-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.6" fill="#334155" fill-opacity="0.4"/>
    </pattern>

    <!-- Component Pad Definition -->
    <g id="via">
      <circle cx="0" cy="0" r="3.2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="1.2" fill="#080a0f"/>
    </g>
    <g id="smd-pad">
      <rect x="-3" y="-5" width="6" height="10" rx="1" fill="#1e293b" stroke="#0ea5e9" stroke-width="0.8"/>
    </g>
  </defs>

  <!-- Deep stealth matte substrate -->
  <rect width="1000" height="340" fill="#06080d" rx="10"/>
  <rect width="1000" height="340" fill="url(#pcb-grid)" rx="10"/>

  <!-- ==================== BACKGROUND PCB TRACES ==================== -->
  <g id="background-traces" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dim ambient routing traces -->
    <path d="M 0 60 L 90 60 L 140 110 L 180 110" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 0 80 L 80 80 L 130 130 L 170 130" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 0 100 L 70 100 L 110 140 L 110 220 L 150 260 L 180 260" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    
    <path d="M 1000 60 L 910 60 L 860 110 L 820 110" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 1000 80 L 920 80 L 870 130 L 830 130" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 1000 100 L 930 100 L 890 140 L 890 220 L 850 260 L 820 260" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>

    <!-- High-speed differential pair (Left) -->
    <path d="M 30 340 L 30 280 L 75 235 L 75 140 L 125 90 L 170 90" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M 42 340 L 42 285 L 87 240 L 87 145 L 133 99 L 170 99" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- High-speed bus traces (Right) -->
    <path d="M 970 340 L 970 280 L 925 235 L 925 140 L 875 90 L 830 90" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>
    <path d="M 958 340 L 958 285 L 913 240 L 913 145 L 867 99 L 830 99" fill="none" stroke="url(#trace-cyan)" stroke-width="1.5" stroke-opacity="0.85"/>

    <!-- Bottom ground trace runs -->
    <path d="M 150 260 L 190 300 L 380 300" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 850 260 L 810 300 L 620 300" fill="none" stroke="url(#trace-dim)" stroke-width="1.2"/>
    <path d="M 380 300 L 410 330 L 590 330 L 620 300" fill="none" stroke="url(#trace-cyan)" stroke-width="1.2" stroke-dasharray="6 3"/>
  </g>

  <!-- ==================== VIA ARRAYS & SOLDER PADS ==================== -->
  <use href="#via" x="170" y="90"/>
  <use href="#via" x="170" y="99"/>
  <use href="#via" x="180" y="110"/>
  <use href="#via" x="170" y="130"/>
  <use href="#via" x="180" y="260"/>

  <use href="#via" x="830" y="90"/>
  <use href="#via" x="830" y="99"/>
  <use href="#via" x="820" y="110"/>
  <use href="#via" x="830" y="130"/>
  <use href="#via" x="820" y="260"/>

  <!-- Left SMT Pin Header Row -->
  <use href="#smd-pad" x="45" y="30"/>
  <use href="#smd-pad" x="60" y="30"/>
  <use href="#smd-pad" x="75" y="30"/>
  <use href="#smd-pad" x="90" y="30"/>
  <use href="#smd-pad" x="105" y="30"/>
  <use href="#smd-pad" x="120" y="30"/>

  <!-- Right SMT Pin Header Row -->
  <use href="#smd-pad" x="880" y="30"/>
  <use href="#smd-pad" x="895" y="30"/>
  <use href="#smd-pad" x="910" y="30"/>
  <use href="#smd-pad" x="925" y="30"/>
  <use href="#smd-pad" x="940" y="30"/>
  <use href="#smd-pad" x="955" y="30"/>

  <!-- ==================== SILICON / SYSTEM FRAME ==================== -->
  <!-- Outer border caliper marks -->
  <path d="M 25 35 L 25 25 L 35 25" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 975 35 L 975 25 L 965 25" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 25 305 L 25 315 L 35 315" fill="none" stroke="#475569" stroke-width="1.5"/>
  <path d="M 975 305 L 975 315 L 965 315" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Inner Chip Die Boundary Box -->
  <rect x="180" y="75" width="640" height="185" rx="4" fill="#090d16" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="185" y="80" width="630" height="175" rx="2" fill="none" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 4"/>

  <!-- Line 1: Technical Monospace Headers -->
  <text x="205" y="99" fill="#38bdf8" font-family="monospace" font-size="9" letter-spacing="1.5">SYS_ARCH // SH-CORE-V2</text>
  <text x="795" y="99" fill="#64748b" font-family="monospace" font-size="9" letter-spacing="1.5" text-anchor="end">FMAX &gt;= 350MHz [DETERMINISTIC]</text>

  <!-- Divider Line -->
  <line x1="205" y1="108" x2="795" y2="108" stroke="#1e293b" stroke-width="1"/>

  <!-- ==================== CENTRAL HERO TYPOGRAPHY ==================== -->
  <!-- Line 2: S O U V I K   H A L D E R (With wide, prominent space between SOUVIK and HALDER) -->
  <text x="500" y="150" fill="url(#text-silver)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="300" text-anchor="middle">
    <tspan letter-spacing="10">S O U V I K</tspan>
    <tspan dx="60" letter-spacing="10">H A L D E R</tspan>
  </text>

  <!-- Line 3: Subtitle with CYBERSECURITY -->
  <text x="500" y="182" fill="url(#text-cyan)" font-family="monospace" font-size="10.5" font-weight="600" letter-spacing="2" text-anchor="middle">PRODUCT DESIGNER // HARDWARE SYSTEMS ARCHITECT // CYBERSECURITY</text>

  <!-- Line 4: AI ACCELERATOR SILICON · DETERMINISTIC COMPUTE · PHYSICAL SYSTEMS -->
  <text x="500" y="204" fill="#94a3b8" font-family="monospace" font-size="9.5" font-weight="400" letter-spacing="1.8" text-anchor="middle">AI ACCELERATOR SILICON · DETERMINISTIC COMPUTE · PHYSICAL SYSTEMS</text>

  <!-- Chip Specs Bar inside box -->
  <g transform="translate(230, 222)">
    <rect x="0" y="0" width="160" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="80" y="12" fill="#cbd5e1" font-family="monospace" font-size="7.5" letter-spacing="1" text-anchor="middle">NEURAL DATAPATHS</text>

    <rect x="190" y="0" width="160" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="270" y="12" fill="#cbd5e1" font-family="monospace" font-size="7.5" letter-spacing="1" text-anchor="middle">INTERLEAVED SRAM</text>

    <rect x="380" y="0" width="160" height="18" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
    <text x="460" y="12" fill="#cbd5e1" font-family="monospace" font-size="7.5" letter-spacing="1" text-anchor="middle">CYBER-PHYSICAL</text>
  </g>

  <!-- ==================== LOWER TECHNICAL SILKSCREEN ==================== -->
  <text x="35" y="325" fill="#475569" font-family="monospace" font-size="8.5" letter-spacing="1.5">NETLIST: VERILOG-2001 // SYNTHESIZABLE</text>
  <text x="500" y="325" fill="#334155" font-family="monospace" font-size="8" letter-spacing="2" text-anchor="middle">IMPEDANCE MATCHED · ZERO STALL CYCLES · OVERFLOW BOUNDED</text>
  <text x="965" y="325" fill="#475569" font-family="monospace" font-size="8.5" letter-spacing="1.5" text-anchor="end">LOC: 22.45N 88.36E // KGP</text>
</svg>
